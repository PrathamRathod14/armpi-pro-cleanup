<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>ArmPi Pro clean-up robot: workflow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t{font-size:14px;font-weight:600}
      .s{font-size:12px}
      .ar{stroke:#555;stroke-width:1.4;fill:none}
      .step rect{fill:#EEEDFE;stroke:#534AB7}.step .t{fill:#3C3489}.step .s{fill:#534AB7}
      .q rect{fill:#FAEEDA;stroke:#854F0B}.q .t{fill:#633806}
      .end rect{fill:#E1F5EE;stroke:#0F6E56}.end .t{fill:#085041}.end .s{fill:#0F6E56}
      .side rect{fill:#F1EFE8;stroke:#888780}.side .t{fill:#444441}.side .s{fill:#5F5E5A}
      .lbl{font-size:12px;fill:#555}
    </style>
  </defs>
  <rect width="700" height="700" fill="#ffffff"/>
  <text x="350" y="32" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#222">Workflow: how the robot cleans up</text>

  <g class="side"><rect x="60" y="55" width="300" height="50" rx="8"/><text class="t" x="210" y="76" text-anchor="middle">Start and check the battery</text><text class="s" x="210" y="95" text-anchor="middle">Needs at least 7.5 V to drive</text></g>
  <g class="step"><rect x="60" y="135" width="300" height="50" rx="8"/><text class="t" x="210" y="156" text-anchor="middle">Look for a cube</text><text class="s" x="210" y="175" text-anchor="middle">Camera checks for blue or red cubes</text></g>
  <g class="q"><rect x="60" y="215" width="300" height="44" rx="8"/><text class="t" x="210" y="242" text-anchor="middle">Cube found?</text></g>
  <g class="step"><rect x="60" y="289" width="300" height="50" rx="8"/><text class="t" x="210" y="310" text-anchor="middle">Drive up to the cube</text><text class="s" x="210" y="329" text-anchor="middle">Steers to keep it in the middle</text></g>
  <g class="step"><rect x="60" y="369" width="300" height="50" rx="8"/><text class="t" x="210" y="390" text-anchor="middle">Line up the gripper</text><text class="s" x="210" y="409" text-anchor="middle">Small arm moves until centred above it</text></g>
  <g class="step"><rect x="60" y="449" width="300" height="50" rx="8"/><text class="t" x="210" y="470" text-anchor="middle">Grab the cube</text><text class="s" x="210" y="489" text-anchor="middle">Lower, close slowly, lift</text></g>
  <g class="q"><rect x="60" y="529" width="300" height="44" rx="8"/><text class="t" x="210" y="556" text-anchor="middle">Is the cube held? (optional check)</text></g>
  <g class="end"><rect x="60" y="603" width="300" height="50" rx="8"/><text class="t" x="210" y="624" text-anchor="middle">Drop it in the basket</text><text class="s" x="210" y="643" text-anchor="middle">Arm turns over the basket and opens</text></g>

  <line class="ar" x1="210" y1="105" x2="210" y2="131" marker-end="url(#a)"/>
  <line class="ar" x1="210" y1="185" x2="210" y2="211" marker-end="url(#a)"/>
  <line class="ar" x1="210" y1="259" x2="210" y2="285" marker-end="url(#a)"/>
  <line class="ar" x1="210" y1="339" x2="210" y2="365" marker-end="url(#a)"/>
  <line class="ar" x1="210" y1="419" x2="210" y2="445" marker-end="url(#a)"/>
  <line class="ar" x1="210" y1="499" x2="210" y2="525" marker-end="url(#a)"/>
  <line class="ar" x1="210" y1="573" x2="210" y2="599" marker-end="url(#a)"/>
  <text class="lbl" x="220" y="277">yes</text>
  <text class="lbl" x="220" y="591">yes</text>

  <line class="ar" x1="360" y1="237" x2="426" y2="237" marker-end="url(#a)"/>
  <text class="lbl" x="384" y="229">no</text>
  <g class="side"><rect x="430" y="212" width="220" height="50" rx="8"/><text class="t" x="540" y="233" text-anchor="middle">Turn and keep looking</text><text class="s" x="540" y="252" text-anchor="middle">Gives up after 60 s</text></g>
  <path class="ar" d="M540 212 L540 160 L364 160" marker-end="url(#a)"/>

  <line class="ar" x1="360" y1="551" x2="426" y2="551" marker-end="url(#a)"/>
  <text class="lbl" x="384" y="543">no</text>
  <g class="side"><rect x="430" y="526" width="220" height="50" rx="8"/><text class="t" x="540" y="547" text-anchor="middle">Open and try again</text><text class="s" x="540" y="566" text-anchor="middle">Up to 3 grabs</text></g>
  <path class="ar" d="M540 526 L540 474 L364 474" marker-end="url(#a)"/>

  <path class="ar" d="M360 628 L672 628 L672 120 L364 120" marker-end="url(#a)"/>
  <text class="lbl" x="470" y="620">then look for the next cube</text>

  <text class="lbl" x="350" y="685" text-anchor="middle">In arm-only modes (arm, frontarm, vlm) the wheels never move: you place the cube within the arm's reach.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
